# ──────────────────────────────────────────────────────────────────────────────
# OpenZync Python SDK — CI/CD pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   - v* tags:   test → build → publish to PyPI → verify
#   - PRs:       test only
#   - push:      test only
#   - manual:    test only
#
# Required GitHub secrets:
#   PYPI_API_TOKEN  — PyPI project-scoped API token for openzync
#                   (https://pypi.org/manage/account/token/)
# ──────────────────────────────────────────────────────────────────────────────

name: CI

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # TEST  (matrix: 3.11, 3.12)
  # ═════════════════════════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  # ═════════════════════════════════════════════════════════════════════════════
  # BUILD  (tags only)
  # ═════════════════════════════════════════════════════════════════════════════
  build:
    name: Build distribution
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  # ═════════════════════════════════════════════════════════════════════════════
  # PUBLISH  (tags only)
  # ═════════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ═════════════════════════════════════════════════════════════════════════════
  # VERIFY  (tags only)
  # ═════════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify PyPI release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify published version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          pip install "openzync==${TAG_VERSION}"
          python -c "import openzync; assert openzync.__version__ == '${TAG_VERSION}', f'Expected {TAG_VERSION}, got {openzync.__version__}'"
          pip show openzync
